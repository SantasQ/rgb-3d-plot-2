<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>RGB 3D Scatter Plot 3</title>
  <script src="https://unpkg.com/vis-graph3d@latest/dist/vis-graph3d.min.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; background: #f4f4f4; }
    #visualization { width: 90vw; height: 80vh; margin: auto; }
  </style>
</head>
<body>

<h2>RGB 3D Scatter Plot from Image</h2>
<div id="visualization"></div>

<script>
  async function loadData() {
    const response = await fetch('rgb_data.csv?v=2');  // キャッシュ対策
    const text = await response.text();
    const lines = text.trim().split('\n').slice(1); // ヘッダー除去

    const data = lines.map(line => {
      const [id, x, y, r, g, b] = line.split(',').map(Number);
      return {
        x: r,
        y: g,
        z: b,
        style: `rgb(${r},${g},${b})`
      };
    });

    const container = document.getElementById('visualization');
    const dataset = new vis.DataSet(data);

    const options = {
      width: '100%',
      height: '100%',
      style: 'dot-color',
      showPerspective: true,
      showGrid: true,
      showShadow: false,
      keepAspectRatio: true,
      verticalRatio: 1.0,
      xLabel: 'R',
      yLabel: 'G',
      zLabel: 'B',
      xStep: 50,
      yStep: 50,
      zStep: 50,
      pointSize: 1,
      animation: false  // 自動回転を無効に
    };

    new vis.Graph3d(container, dataset, options);
  }

  loadData();
</script>

</body>
</html>
